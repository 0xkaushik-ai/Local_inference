[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devicebench-local"
version = "0.1.0"
description = "Reproducible local inference measurements with inspectable evidence"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devicebench = "devicebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
