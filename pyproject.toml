[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "devicebench-local"
version = "0.2.0"
description = "Local AI readiness diagnostics, model/context checks, integration probes, and inspectable benchmarks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devicebench = "devicebench.cli:main"
devicebench-app = "devicebench.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"devicebench.readiness" = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/devicebench/readiness/**/*.py", "src/devicebench/launcher.py", "tests/test_launcher.py", "tests/test_readiness*.py", "tests/readiness_fixture.py", "scripts/build-app.py", "scripts/check-app.py", "scripts/app-entry.py", "scripts/check-release.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]
